dataset_path: data/vibroso_tiny_instruction_seed.jsonl
dataset_kind: instruction_jsonl

# During --init-from, the tokenizer is loaded from the base checkpoint.
# These fields document the expected base tokenizer setup from configs/wikipedia.yaml.
tokenizer_kind: sentencepiece
tokenizer_vocab_size: 4096
tokenizer_train_chars: 1000000
tokenizer_prefix: tokenizers/sentencepiece/wiki_4096
tokenizer_model_path: tokenizers/sentencepiece/wiki_4096.model
tokenizer_model_type: bpe

checkpoint_dir: checkpoints/instruct_seed123

seed: 1337
device: cuda

train_split: 0.9
batch_size: 16
block_size: 256

max_steps: 1000
eval_interval: 100
eval_iters: 20
checkpoint_interval: 250
learning_rate: 0.00005
weight_decay: 0.1

model:
  n_embd: 256
  n_head: 4
  n_layer: 4
  dropout: 0.1
  mlp_type: swiglu
