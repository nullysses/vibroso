dataset_path: data/my_wikipedia_pages.txt
dataset_kind: wikipedia_titles
tokenizer_kind: subword
tokenizer_vocab_size: 1024
corpus_cache_path: data/fetched_wikipedia_corpus.txt
wikipedia_language: en
user_agent: "vibroso/0.1 academic corpus builder"
checkpoint_dir: checkpoints

seed: 1337
device: auto

train_split: 0.9
batch_size: 16
block_size: 64

max_steps: 2000
eval_interval: 100
eval_iters: 20
checkpoint_interval: 500
learning_rate: 0.001
weight_decay: 0.1

model:
  n_embd: 128
  n_head: 4
  n_layer: 2
  dropout: 0.1
