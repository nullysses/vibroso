dataset_path: data/my_links_corpus.txt
dataset_kind: url_list
corpus_cache_path: data/fetched_links_corpus.txt
fetch_timeout: 20
user_agent: "toy-llm/0.1 academic corpus builder"
checkpoint_dir: checkpoints

seed: 1337
device: auto

train_split: 0.9
batch_size: 16
block_size: 64

max_steps: 2000
eval_interval: 100
eval_iters: 20
checkpoint_interval: 500
learning_rate: 0.001
weight_decay: 0.1

model:
  n_embd: 128
  n_head: 4
  n_layer: 2
  dropout: 0.1
