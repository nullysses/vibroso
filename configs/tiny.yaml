dataset_path: data/input.txt
tokenizer_kind: subword
tokenizer_vocab_size: 256
checkpoint_dir: checkpoints

seed: 1337
device: auto

train_split: 0.9
batch_size: 16
block_size: 64

max_steps: 2000
eval_interval: 100
eval_iters: 20
checkpoint_interval: 500
learning_rate: 0.001
weight_decay: 0.1

model:
  n_embd: 128
  n_head: 4
  n_layer: 2
  dropout: 0.1
