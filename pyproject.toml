[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "toy-llm"
version = "0.1.0"
description = "A small academic character-level GPT implemented with PyTorch."
requires-python = ">=3.10"
dependencies = [
  "torch",
  "pyyaml",
  "wikipedia-api",
  "sentencepiece",
]

[project.optional-dependencies]
dev = [
  "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
